{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 p-4" style="border-radius: 20px;">
            <div class="text-center mb-4">
                <i class="bi bi-star-fill text-warning" style="font-size: 3rem;"></i>
                <h2 class="fw-bold mt-2">Rate Your Experience</h2>
                <p class="text-muted">How was your transaction with <strong>{{ auction.seller.username }}</strong>?</p>
            </div>
            
            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}
                
                <div class="mb-4 text-center">
                    <label class="form-label fw-bold mb-3 d-block">Overall Rating</label>
                    <div class="rating-stars">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating1" value="1">
                            <label class="form-check-label" for="rating1">1 <i class="bi bi-star-fill text-warning"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating2" value="2">
                            <label class="form-check-label" for="rating2">2 <i class="bi bi-star-fill text-warning"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating3" value="3">
                            <label class="form-check-label" for="rating3">3 <i class="bi bi-star-fill text-warning"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating4" value="4">
                            <label class="form-check-label" for="rating4">4 <i class="bi bi-star-fill text-warning"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating5" value="5" checked>
                            <label class="form-check-label" for="rating5">5 <i class="bi bi-star-fill text-warning"></i></label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="comment" class="form-label fw-bold">Leave a Comment (Optional)</label>
                    <textarea class="form-control bg-light" id="comment" name="comment" rows="4" placeholder="Share details of your experience..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow rounded-pill">
                    Submit Review
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
