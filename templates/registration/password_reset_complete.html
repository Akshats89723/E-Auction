{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card border-0 shadow-lg rounded-4 p-5 text-center">
      <div class="mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-10 mb-3" style="width:80px;height:80px;">
          <i class="bi bi-shield-fill-check text-success" style="font-size:2.2rem;"></i>
        </div>
        <h3 class="fw-bold">Password Updated!</h3>
        <p class="text-muted">Your password has been successfully reset. You can now log in with your new password.</p>
      </div>
      <a href="{% url 'login' %}" class="btn btn-success rounded-pill px-5 fw-bold py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login Now
      </a>
    </div>
  </div>
</div>
{% endblock %}
