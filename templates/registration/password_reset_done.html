{% extends "base.html" %}
{% block title %}Reset Email Sent{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card border-0 shadow-lg rounded-4 p-5 text-center">
      <div class="mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-10 mb-3" style="width:80px;height:80px;">
          <i class="bi bi-envelope-check-fill text-success" style="font-size:2.2rem;"></i>
        </div>
        <h3 class="fw-bold">Check Your Email</h3>
        <p class="text-muted">We've sent a password reset link to your email address. The link expires in 24 hours.</p>
      </div>
      <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 fw-bold">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
