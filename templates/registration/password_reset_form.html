{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="col-md-5 mx-auto card shadow-lg border-0 rounded-4 p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary display-4"></i>
            <h2 class="fw-bold mt-2">Reset Password</h2>
            <p class="text-muted">Enter your email and we'll send you a link to reset your account.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control rounded-3 py-2" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">
                Send Reset Link
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
